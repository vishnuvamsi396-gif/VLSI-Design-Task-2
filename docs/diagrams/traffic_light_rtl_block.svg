<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Timed traffic-light controller RTL block</title><desc id="desc">Clock and reset drive a state register and elapsed-cycle counter. State timing parameters feed a transition timer. State output decoding produces red, yellow, and green signals.</desc>
<defs><style>.t{font-family:Arial,sans-serif;fill:#14283e}.h{font-family:Arial,sans-serif;font-weight:700;fill:#14283e}.sub{font-family:Arial,sans-serif;fill:#4a5e73}.b{fill:#fff;stroke:#4b7196;stroke-width:2}.ctl{fill:#e4f0ff;stroke:#4278af;stroke-width:2}.logic{fill:#fff7df;stroke:#c79732;stroke-width:2}.out{fill:#ecf8ef;stroke:#62a376;stroke-width:2}.line{stroke:#315878;stroke-width:3;fill:none}.arr{marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315878"/></marker></defs>
<rect width="1200" height="620" fill="#f5f8fc"/><text x="600" y="48" text-anchor="middle" class="h" font-size="30">Timed Traffic-Light Controller RTL</text><text x="600" y="78" text-anchor="middle" class="sub" font-size="17">Moore FSM mini-project with configurable state durations</text>
<rect class="ctl" x="40" y="210" width="180" height="135" rx="16"/><text x="130" y="250" text-anchor="middle" class="h" font-size="20">Inputs</text><text x="130" y="285" text-anchor="middle" class="t" font-size="16">clk, reset</text><text x="130" y="315" text-anchor="middle" class="sub" font-size="14">reset selects RED</text>
<rect class="b" x="295" y="170" width="255" height="220" rx="18"/><text x="422" y="208" text-anchor="middle" class="h" font-size="20">State + Elapsed</text><text x="422" y="238" text-anchor="middle" class="h" font-size="20">Registers</text><text x="422" y="285" text-anchor="middle" class="t" font-size="16">state: RED / GREEN / YELLOW</text><text x="422" y="315" text-anchor="middle" class="t" font-size="16">elapsed clock cycles</text><text x="422" y="352" text-anchor="middle" class="sub" font-size="14">updated on rising edge</text>
<rect class="logic" x="650" y="135" width="250" height="265" rx="18"/><text x="775" y="175" text-anchor="middle" class="h" font-size="20">Transition Logic</text><text x="775" y="215" text-anchor="middle" class="t" font-size="15">Select duration by state</text><text x="775" y="255" text-anchor="middle" class="t" font-size="15">Compare elapsed cycles</text><text x="775" y="295" text-anchor="middle" class="t" font-size="15">On expiry:</text><text x="775" y="325" text-anchor="middle" class="t" font-size="16">RED → GREEN</text><text x="775" y="352" text-anchor="middle" class="t" font-size="16">GREEN → YELLOW → RED</text><text x="775" y="380" text-anchor="middle" class="sub" font-size="13">clear timer at each transition</text>
<rect class="ctl" x="645" y="450" width="260" height="95" rx="16"/><text x="775" y="487" text-anchor="middle" class="h" font-size="18">Duration Parameters</text><text x="775" y="518" text-anchor="middle" class="t" font-size="15">RED_CYCLES / GREEN_CYCLES / YELLOW_CYCLES</text>
<rect class="out" x="1000" y="200" width="160" height="155" rx="18"/><text x="1080" y="240" text-anchor="middle" class="h" font-size="20">Output Decode</text><text x="1080" y="280" text-anchor="middle" class="t" font-size="15">red, yellow, green</text><text x="1080" y="315" text-anchor="middle" class="sub" font-size="14">one-hot by state</text>
<path class="line arr" d="M220 275 H285"/><path class="line arr" d="M550 240 H640"/><path class="line arr" d="M650 365 H560 V335 H550"/><path class="line arr" d="M775 450 V410"/><path class="line arr" d="M550 285 C760 285 825 278 990 278"/>
<text x="600" y="590" text-anchor="middle" class="sub" font-size="15">RTL source: rtl/fsm_controllers.v • verification: testbench/tb_traffic_light_controller.v</text></svg>