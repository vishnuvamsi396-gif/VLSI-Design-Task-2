<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Moore traffic light FSM</title><desc id="desc">Reset enters RED. A tick advances RED to GREEN, GREEN to YELLOW, and YELLOW back to RED. Outputs are decoded from the current state.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="900" height="470" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Moore Traffic Light Controller</text>
<g font-family="Arial,sans-serif" text-anchor="middle"><rect x="75" y="168" width="190" height="110" rx="22" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="170" y="208" font-size="23" font-weight="700" fill="#991b1b">RED</text><text x="170" y="241" font-size="17" fill="#334155">red=1, yellow=0, green=0</text>
<rect x="355" y="82" width="190" height="110" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="450" y="122" font-size="23" font-weight="700" fill="#166534">GREEN</text><text x="450" y="155" font-size="17" fill="#334155">red=0, yellow=0, green=1</text>
<rect x="635" y="168" width="190" height="110" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="730" y="208" font-size="23" font-weight="700" fill="#92400e">YELLOW</text><text x="730" y="241" font-size="17" fill="#334155">red=0, yellow=1, green=0</text></g>
<g stroke="#334155" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M265 185 C300 140 320 125 345 125"/><path d="M545 125 C590 125 610 160 625 185"/><path d="M635 250 C520 360 375 360 265 250"/></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#334155"><text x="295" y="128">tick</text><text x="585" y="114">tick</text><text x="450" y="375" text-anchor="middle">tick</text><text x="58" y="320" fill="#991b1b">reset → RED</text></g>
<text x="450" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#475569">Outputs depend on registered state; each asserted tick advances one phase.</text>
</svg>