<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Task 2 RTL design overview</title><desc id="desc">Clock and reset drive sequential blocks, counters, parameterized modules, and FSM controllers. Testbenches verify outputs with Icarus Verilog and GTKWave.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker></defs>
<rect width="1200" height="520" fill="#f8fafc"/><text x="600" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Task 2 RTL Design and Verification Flow</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="45" y="105" width="190" height="115" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="140" y="145" font-size="20" font-weight="700" fill="#1e3a8a">Clock + Reset</text><text x="140" y="177" font-size="15" fill="#334155">tick / enable</text><text x="140" y="199" font-size="15" fill="#334155">synchronous control</text>
<rect x="300" y="80" width="250" height="150" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="425" y="120" font-size="20" font-weight="700" fill="#14532d">Sequential Blocks</text><text x="425" y="153" font-size="16" fill="#334155">D flip-flops</text><text x="425" y="179" font-size="16" fill="#334155">registers + shift registers</text><text x="425" y="205" font-size="15" fill="#334155">sync and async reset</text>
<rect x="300" y="285" width="250" height="140" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="425" y="325" font-size="20" font-weight="700" fill="#78350f">Counters</text><text x="425" y="359" font-size="16" fill="#334155">up / down / Mod-10</text><text x="425" y="386" font-size="16" fill="#334155">ring / Johnson</text>
<rect x="610" y="80" width="250" height="150" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="735" y="120" font-size="20" font-weight="700" fill="#4c1d95">Parameterized RTL</text><text x="735" y="155" font-size="16" fill="#334155">N-bit registers</text><text x="735" y="182" font-size="16" fill="#334155">counters + shift registers</text><text x="735" y="207" font-size="15" fill="#334155">reusable widths</text>
<rect x="610" y="285" width="250" height="140" rx="14" fill="#ffe4e6" stroke="#e11d48" stroke-width="2"/><text x="735" y="325" font-size="20" font-weight="700" fill="#881337">FSM Controllers</text><text x="735" y="359" font-size="16" fill="#334155">traffic light</text><text x="735" y="386" font-size="16" fill="#334155">vending + elevator</text>
<rect x="930" y="160" width="220" height="160" rx="14" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="1040" y="200" font-size="20" font-weight="700" fill="#0f172a">Verification</text><text x="1040" y="235" font-size="16" fill="#334155">self-checking testbench</text><text x="1040" y="262" font-size="16" fill="#334155">Icarus Verilog</text><text x="1040" y="289" font-size="16" fill="#334155">VCD + GTKWave</text>
</g>
