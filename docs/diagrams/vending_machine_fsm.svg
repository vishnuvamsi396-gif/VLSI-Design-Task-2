<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330">
<rect width="960" height="330" fill="#f8fafc"/><text x="480" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#14213d">Vending machine FSM (product cost: 15)</text>
<g font-family="Arial" text-anchor="middle" fill="#102a43">
<rect x="65" y="120" width="150" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="140" y="151" font-size="17">C0</text><text x="140" y="176" font-size="14">0 credit</text>
<rect x="290" y="120" width="150" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="365" y="151" font-size="17">C5</text><text x="365" y="176" font-size="14">5 credit</text>
<rect x="515" y="120" width="150" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="590" y="151" font-size="17">C10</text><text x="590" y="176" font-size="14">10 credit</text>
<rect x="750" y="120" width="150" height="76" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="825" y="151" font-size="17">VEND</text><text x="825" y="176" font-size="14">vend = 1 cycle</text>
</g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M215 142 H285"/><path d="M440 142 H510"/><path d="M665 142 H745"/><path d="M365 196 C365 270 140 270 140 201"/><path d="M590 196 C590 302 140 302 140 201"/><path d="M825 196 C825 256 140 256 140 201"/></g>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<g font-family="Arial" font-size="13" fill="#334155"><text x="237" y="132">coin5</text><text x="462" y="132">coin5</text><text x="687" y="132">coin5</text><text x="265" y="267">coin10 → C10</text><text x="455" y="295">coin10 → vend + change5</text><text x="692" y="250">next transaction → C0</text></g>
<text x="480" y="322" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">Coin inputs are sampled on the rising clock edge. The controller returns to C0 after dispensing.</text></svg>