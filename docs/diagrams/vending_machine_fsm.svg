<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#f8fafc"/><text x="480" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#14213d">Vending machine FSM (product cost: 15)</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle" fill="#102a43"><rect x="70" y="125" width="145" height="72" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="142" y="154" font-size="17">C0</text><text x="142" y="177" font-size="14">0 credit</text><rect x="300" y="125" width="145" height="72" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="372" y="154" font-size="17">C5</text><text x="372" y="177" font-size="14">5 credit</text><rect x="530" y="125" width="145" height="72" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="602" y="154" font-size="17">C10</text><text x="602" y="177" font-size="14">10 credit</text><rect x="760" y="125" width="145" height="72" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="832" y="154" font-size="17">VEND</text><text x="832" y="177" font-size="14">vend = 1 cycle</text></g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M215 142 H295"/><path d="M215 182 C320 235 465 235 535 187"/><path d="M445 142 H525"/><path d="M445 180 C545 240 690 240 765 187"/><path d="M675 142 H755"/><path d="M832 125 C832 58 142 58 142 119"/></g>
<g font-family="Arial" font-size="13" fill="#334155"><text x="250" y="132">coin5</text><text x="370" y="237">coin10</text><text x="480" y="132">coin5</text><text x="600" y="238">coin10</text><text x="710" y="132">coin5</text><text x="475" y="51">automatic return to C0</text><text x="635" y="265">coin10 in C10: vend + change5</text></g>
<text x="480" y="325" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">C5 + coin10 and C10 + coin5 vend at exact credit; coin10 at C10 returns 5 units.</text></svg>