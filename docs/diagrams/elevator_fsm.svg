<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#f8fafc"/><text x="480" y="36" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#14213d">Three-floor elevator controller FSM</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs>
<g font-family="Arial" text-anchor="middle" fill="#102a43"><circle cx="480" cy="175" r="62" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="480" y="170" font-size="18">IDLE</text><text x="480" y="194" font-size="13">door open</text><rect x="105" y="135" width="170" height="80" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="190" y="169" font-size="18">UP</text><text x="190" y="193" font-size="13">motor_up = 1</text><rect x="685" y="135" width="170" height="80" rx="15" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="770" y="169" font-size="18">DOWN</text><text x="770" y="193" font-size="13">motor_down = 1</text></g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M420 150 C365 100 310 108 275 148"/><path d="M275 196 C320 250 378 248 424 204"/><path d="M540 150 C595 100 650 108 685 148"/><path d="M685 196 C640 250 582 248 536 204"/></g>
<g font-family="Arial" font-size="13" fill="#334155"><text x="335" y="98">request_floor &gt; floor</text><text x="326" y="260">tick until target reached</text><text x="620" y="98">request_floor &lt; floor</text><text x="598" y="260">tick until target reached</text></g>
<rect x="170" y="285" width="620" height="45" rx="10" fill="#e2e8f0"/><text x="480" y="313" text-anchor="middle" font-family="Arial" font-size="14" fill="#334155">floor register ranges 0–2; each tick moves one floor, then controller returns to IDLE</text></svg>