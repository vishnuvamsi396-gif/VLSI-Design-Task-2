<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Counter RTL architecture</title><desc id="desc">Five independent four-bit synchronous counters share a clock and active-high reset: up, down, Mod-10, ring, and Johnson.</desc>
<defs><style>.t{font-family:Arial,sans-serif;fill:#14283e}.h{font-family:Arial,sans-serif;font-weight:700;fill:#14283e}.sub{font-family:Arial,sans-serif;fill:#4a5e73}.card{fill:#fff;stroke:#4c7198;stroke-width:2}.ctl{fill:#e4f0ff;stroke:#4278af;stroke-width:2}.line{stroke:#315878;stroke-width:3;fill:none}.arr{marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#315878"/></marker></defs>
<rect width="1200" height="760" fill="#f5f8fc"/><text x="600" y="48" text-anchor="middle" class="h" font-size="30">Counter RTL Architecture</text><text x="600" y="78" text-anchor="middle" class="sub" font-size="17">Five independent positive-edge-triggered four-bit counters</text>
<rect class="ctl" x="40" y="120" width="235" height="525" rx="20"/><text x="157" y="165" text-anchor="middle" class="h" font-size="21">Shared Control</text><text x="157" y="215" text-anchor="middle" class="t" font-size="18">clk</text><text x="157" y="250" text-anchor="middle" class="t" font-size="18">active-high reset</text><text x="157" y="285" text-anchor="middle" class="sub" font-size="14">synchronous</text><text x="157" y="344" text-anchor="middle" class="sub" font-size="15">Each counter advances</text><text x="157" y="369" text-anchor="middle" class="sub" font-size="15">on every rising edge</text><text x="157" y="425" text-anchor="middle" class="sub" font-size="15">No enable input</text><text x="157" y="600" text-anchor="middle" class="sub" font-size="14">rtl/counters.v</text>
<path class="line" d="M275 380 H305 V169 H330 M305 272 H330 M305 375 H330 M305 478 H330 M305 581 H330"/>
<g><rect class="card" x="330" y="120" width="820" height="95" rx="15"/><text x="365" y="158" class="h" font-size="20">4-bit Up Counter</text><text x="365" y="190" class="t" font-size="16">Reset 0000 • next = count + 1 mod 16</text><rect x="900" y="137" width="220" height="60" rx="10" fill="#e9f7ef" stroke="#5b9b6d"/><text x="1010" y="162" text-anchor="middle" class="sub" font-size="14">Output count[3:0]</text><text x="1010" y="184" text-anchor="middle" class="t" font-size="14">0 → 15 → 0</text></g>
<g><rect class="card" x="330" y="223" width="820" height="95" rx="15"/><text x="365" y="261" class="h" font-size="20">4-bit Down Counter</text><text x="365" y="293" class="t" font-size="16">Reset 1111 • next = count - 1 mod 16</text><rect x="900" y="240" width="220" height="60" rx="10" fill="#e9f7ef" stroke="#5b9b6d"/><text x="1010" y="265" text-anchor="middle" class="sub" font-size="14">Output count[3:0]</text><text x="1010" y="287" text-anchor="middle" class="t" font-size="14">15 → 0 → 15</text></g>
<g><rect class="card" x="330" y="326" width="820" height="95" rx="15"/><text x="365" y="364" class="h" font-size="20">Mod-10 Counter</text><text x="365" y="396" class="t" font-size="16">Reset 0000 • after 9, next = 0</text><rect x="900" y="343" width="220" height="60" rx="10" fill="#e9f7ef" stroke="#5b9b6d"/><text x="1010" y="368" text-anchor="middle" class="sub" font-size="14">Output count[3:0]</text><text x="1010" y="390" text-anchor="middle" class="t" font-size="14">0 → 9 → 0</text></g>
<g><rect class="card" x="330" y="429" width="820" height="95" rx="15"/><text x="365" y="467" class="h" font-size="20">4-bit Ring Counter</text><text x="365" y="499" class="t" font-size="16">Reset 0001 • rotate left, feed MSB back to bit 0</text><rect x="900" y="446" width="220" height="60" rx="10" fill="#e9f7ef" stroke="#5b9b6d"/><text x="1010" y="471" text-anchor="middle" class="sub" font-size="14">Output count[3:0]</text><text x="1010" y="493" text-anchor="middle" class="t" font-size="13">0001 → 0010 → 0100 → 1000</text></g>
<g><rect class="card" x="330" y="532" width="820" height="95" rx="15"/><text x="365" y="570" class="h" font-size="20">4-bit Johnson Counter</text><text x="365" y="602" class="t" font-size="16">Reset 0000 • shift left, feed inverted MSB to bit 0</text><rect x="900" y="549" width="220" height="60" rx="10" fill="#e9f7ef" stroke="#5b9b6d"/><text x="1010" y="574" text-anchor="middle" class="sub" font-size="14">Output count[3:0]</text><text x="1010" y="596" text-anchor="middle" class="t" font-size="13">8 states per sequence</text></g>
<text x="600" y="710" text-anchor="middle" class="sub" font-size="15">Simulation checks reset and sequence behavior: testbench/tb_counters.v</text></svg>